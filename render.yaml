services:
  - type: web
    name: bestclipnest-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: SIGNING_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://bestclipnest.blogspot.com
